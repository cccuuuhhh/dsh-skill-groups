  <rect x="3" y="17.5" width="18" height="3" rx="1.5" stroke-dasharray="1 2.5" />
  <circle cx="6.4" cy="6" r="0.9" fill="currentColor" stroke="none" />
  <circle cx="6.4" cy="13" r="0.9" fill="currentColor" stroke="none" />
</svg>
