name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted Publishing (OIDC) 需要 npm 11.5.1+，Node 22 自带的 10.9 不支持
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      # 不写 registry-url，避免 setup-node 注入空的 _authToken 覆盖 OIDC
      - name: Verify OIDC identity
        run: npm whoami

      - name: Publish
        run: npm publish --access public --provenance
